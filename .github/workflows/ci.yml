name: MAURITOP CI

on:
  push:
    branches:
      - main
      - "recovery/**"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mauritop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
