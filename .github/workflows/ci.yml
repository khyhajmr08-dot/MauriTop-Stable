name: MAURITOP CI

on:
  push:
    branches:
      - main
      - "recovery/**"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mauritop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save synchronized lockfile on recovery branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/recovery/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "chore: synchronize npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Install dependencies from synchronized lockfile
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
