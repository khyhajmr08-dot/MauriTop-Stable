name: MAURITOP CI

on:
  push:
    branches:
      - main
      - "recovery/**"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mauritop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Firebase Admin CommonJS runtime
        run: node -e "require('firebase-admin/app'); require('firebase-admin/auth'); require('firebase-admin/firestore'); console.log('Firebase Admin runtime imports OK')"
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
